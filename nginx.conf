# The front door: one origin serving both the Lago admin UI and the Lago API.
#
# Upstream runs these as two containers on two ports. Collapsing them onto one
# hostname is what makes the Fly deployment single-app, and it means the SPA
# talks to its API same-origin (API_URL is this very host — see start.sh), so
# there is no CORS surface and no second certificate.
#
# nginx matches locations by SPECIFICITY, not by file order: every prefix below
# is longer than `/`, so the API paths win over the SPA catch-all regardless of
# where this file lands in the include order.

# Rails logs to stdout already (RAILS_LOG_TO_STDOUT); send nginx there too so
# `fly logs` is the single place to look.
error_log /dev/stderr warn;

upstream lago_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 8080;
  listen [::]:8080;

  root /usr/share/nginx/html;

  access_log /dev/stdout;

  # Invoice payloads and event batches are larger than nginx's 1m default.
  client_max_body_size 25m;

  # Compression. Declared at server level rather than by copying the front
  # image's gzip.conf, which begins with `gzip on;` — a directive Debian's
  # stock nginx.conf already sets at http level, and a duplicate `gzip` is a
  # fatal config error, not a warning.
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/xml
    font/opentype
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  # Lago's own proxy-awareness. Fly terminates TLS at its edge and forwards
  # over plain HTTP, so without this Rails would mint http:// URLs (checkout
  # links, webhook callbacks) for an https-only deployment.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_http_version 1.1;

  # Invoice generation and event batches can outrun the 60s default.
  proxy_read_timeout 120s;

  # --- the API halves -------------------------------------------------------

  # REST. Also the path LiteLLM's metering callback posts events to, though it
  # reaches us over 6PN on :3000 rather than through here.
  location /api/ {
    proxy_pass http://lago_api;
  }

  # GraphQL is what the admin UI actually runs on; /api/ is for integrations.
  location /graphql {
    proxy_pass http://lago_api;
  }

  # Inbound provider callbacks — Stripe's webhooks land here. This is the one
  # path that MUST stay publicly reachable for payments to settle.
  location /webhooks/ {
    proxy_pass http://lago_api;
  }

  # ActiveStorage blobs (invoice PDFs, imported files).
  location /rails/ {
    proxy_pass http://lago_api;
  }

  # Fly's health check target. Unauthenticated by design, upstream.
  location = /health {
    access_log off;
    proxy_pass http://lago_api;
  }

  # ActionCable. The UI opens this for live updates; without the Upgrade pair
  # the handshake 400s and the app falls back to silence rather than an error.
  location /cable {
    proxy_pass http://lago_api;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # --- the SPA --------------------------------------------------------------

  # Content-hashed filenames, so immutable is safe and correct.
  location /assets/ {
    include /etc/nginx/conf.d/csp.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # env-config.js is rewritten on every boot by .env.sh; caching it would pin
  # the UI to a stale API URL across a redeploy.
  location = /env-config.js {
    include /etc/nginx/conf.d/csp.conf;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/csp.conf;
    add_header Cache-Control "no-cache";
    index index.html;
    try_files $uri $uri/ /index.html =404;
  }
}
